version: 2
builds:
  - main: ./cmd/crashscope
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: "-s -w -X crashscope/internal/version.Version={{ .Version }}"
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
