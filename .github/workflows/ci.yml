name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      # testcorpus/synthetic holds byte-identical copies of the parser
      # fixtures (plus unrecognized.log, which lives only there); fail the
      # build before the copies silently drift apart.
      - name: Fixture copies are in sync
        run: |
          for f in internal/parser/testdata/*; do
            cmp "$f" "testcorpus/synthetic/$(basename "$f")"
          done
      - run: go test ./... -v
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: goreleaser/goreleaser-action@v6
        with: { args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
